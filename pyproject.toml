[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subcellseg"
version = "0.1.0"
description = "SubCellSeg: one 3D segmentation model for many fluorescently tagged cellular structures"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["segmentation", "microscopy", "3D", "deep learning", "cell biology"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "torch>=2.2",
    "pytorch-lightning>=2.2",
    "monai>=1.4",
    "bioio>=1.5",
    "bioio-ome-tiff",
    "bioio-tifffile",
    "tifffile>=2024.1",
    "numpy>=1.24",
    "tqdm",
]

[project.optional-dependencies]
# Extra file formats. Each one is a bioio reader plugin.
czi = ["bioio-czi"]
zarr = ["bioio-ome-zarr"]
nd2 = ["bioio-nd2"]
all = ["bioio-czi", "bioio-ome-zarr", "bioio-nd2"]
notebook = ["jupyterlab", "matplotlib"]
dev = ["pytest>=8", "pytest-timeout"]

[project.urls]
Homepage = "https://github.com/AllenCell/SubCellSeg"
Issues = "https://github.com/AllenCell/SubCellSeg/issues"

[project.scripts]
subcellseg = "subcellseg.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/subcellseg"]

# Note on PyTorch: which build is right (CUDA version, or CPU-only) depends on
# the machine, and on Windows the default from PyPI is CPU-only. The install
# instructions therefore use `uv ... --torch-backend auto`, which detects the
# GPU and picks the matching build. See docs/INSTALL.md.

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600  # a hung data worker should fail the run, not stall it
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
