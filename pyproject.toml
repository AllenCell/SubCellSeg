[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "megaseg"
version = "0.1.0"
description = "MegaSeg: one 3D segmentation model for many fluorescently tagged cellular structures"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["segmentation", "microscopy", "3D", "deep learning", "cell biology"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "torch>=2.2",
    "pytorch-lightning>=2.2",
    "monai>=1.4",
    "bioio>=1.5",
    "bioio-ome-tiff",
    "bioio-tifffile",
    "tifffile>=2024.1",
    "numpy>=1.24",
    "tqdm",
]

[project.optional-dependencies]
# Extra file formats. Each one is a bioio reader plugin.
czi = ["bioio-czi"]
zarr = ["bioio-ome-zarr"]
nd2 = ["bioio-nd2"]
all = ["bioio-czi", "bioio-ome-zarr", "bioio-nd2"]
notebook = ["jupyterlab", "matplotlib"]
dev = ["pytest>=8"]

[project.scripts]
megaseg = "megaseg.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/megaseg"]

# --- uv only -----------------------------------------------------------------
# PyPI ships a CPU-only torch for Windows. With uv, pull the CUDA build on both
# Linux and Windows so a GPU works out of the box. pip ignores this section;
# see "Installation" in the README for the pip route.
[tool.uv.sources]
torch = [
    { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
